[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenos"
version = "0.1.0"
description = "ZenOS - Agent Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["zenos*", "orchestrator*", "memory*", "models*", "security*", "mcp*", "api*", "observability*", "infra*"]
exclude = ["tests*", "docs*", "scripts*", "config*"]

[tool.ruff]
line-length = 120
target-version = "py311"
