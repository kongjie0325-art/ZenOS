# ZenOS Configuration

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  log_level: "info"

orchestrator:
  max_retries: 3
  timeout: 60
  checkpoint_interval: 5

model_router:
  default_model: "claude-sonnet-4"
  fallback_chain:
    - "claude-sonnet-4"
    - "gpt-4o"
    - "gemini-2.0-flash"
    - "deepseek-chat"
  cost_aware: true
  latency_aware: true

memory:
  working:
    backend: "redis"
    url: "redis://localhost:6379/0"
    ttl: 3600
  episodic:
    backend: "postgres"
    url: "postgresql://zenos:zenos@localhost:5432/zenos"
  semantic:
    backend: "qdrant"
    url: "http://localhost:6333"
    api_key: "${QDRANT_API_KEY}"
    vector_size: 384
  artifact:
    backend: "minio"
    endpoint: "http://localhost:9000"
    access_key: "${MINIO_ACCESS_KEY}"
    secret_key: "${MINIO_SECRET_KEY}"
    bucket: "zenos"

mcp:
  servers:
    - name: "filesystem"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem"]
    - name: "git"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-git"]
    - name: "github"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_TOKEN: "${GITHUB_TOKEN}"

security:
  jwt_secret: "${JWT_SECRET}"
  rate_limit: 100
  tool_permissions:
    default: "require_approval"
    allowed_roles: ["admin", "operator"]

observability:
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000
  loki:
    enabled: true
    url: "http://localhost:3100"

nodes:
  - name: "primary"
    host: "localhost"
    role: "orchestrator"
  - name: "executor"
    host: "${EXECUTOR_HOST}"
    role: "executor"
